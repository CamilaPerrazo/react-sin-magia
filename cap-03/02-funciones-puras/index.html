<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funciones puras</title>
</head>
<body>
    <script>

        const formatPrice = (price) =>
            new Intl.NumberFormat("es-EC", {
                style: "currency",
                currency: "USD",
            }).format(price);

        console.log("Funcion pura");
        console.log(formatPrice(1.5));
        console.log(formatPrice(1.5));

        let taxRate = 0.12;

        const priceWithTax = (price) => price * (1 + taxRate);

        console.log("Funcion que lee una variable externa");
        console.log(formatPrice(priceWithTax(1.5)));

        taxRate = 0.15;

        console.log(formatPrice(priceWithTax(1.5)));

        const menuItem = {
            id: 1,
            iceCream: {
                id: 3,
                name: "Mora silvestre",
                imagePath: "images/mora.svg",
            },
            price: 1.5,
            description: "Mora de Ambato con un toque de limón.",
            inStock: true,
        };

        const applyDiscount = (item, percent) => {
            item.price = item.price * (1 - percent);
            return item;
        };

        console.log("Modificar el objeto original");
        console.log(formatPrice(menuItem.price));

        const enOferta = applyDiscount(menuItem, 0.2);

        console.log(formatPrice(enOferta.price));
        console.log(formatPrice(menuItem.price));

        const withDiscount = (item, percent) => ({
            ...item,
            price: item.price * (1 - percent),
        });

        const rebajado = withDiscount(menuItem, 0.2);

        console.log("Crear un objeto nuevo");
        console.log(formatPrice(rebajado.price));
        console.log(formatPrice(menuItem.price));

        console.log(rebajado === menuItem);
        console.log(rebajado.iceCream === menuItem.iceCream);

        // Actividad 13

        const menu = [menuItem];

        const addItemPush = (menu, item) => {
            menu.push(item);
            return menu;
        };

        const addItem = (menu, item) => [...menu, item];

        console.log("Longitud inicial");
        console.log(menu.length);

        addItemPush(menu, rebajado);

        console.log("Longitud despues de push");
        console.log(menu.length);

        addItem(menu, rebajado);

        console.log("Longitud despues de spread");
        console.log(menu.length);

    </script>
</body>
</html>
