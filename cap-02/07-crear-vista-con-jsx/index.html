
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heladeria</title>
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/@babel/standalone@8.0.4/babel.min.js"></script>
    <script type="text/babel" data-type="module">
        import React from "https://esm.sh/react@19.2.0?dev";
        import {createRoot} from "https://esm.sh/react-dom@19.2.0/client?dev";

        const menu = (
            <>
                <main>
                    <h1>La Heladería</h1>

                    <article className="menu-item">
                        <h2>Mora silvestre</h2>
                        <p className="menu-item-description">
                            Mora de Ambato con un toque de limón.
                        </p>
                    </article>

                    <article className="menu-item">
                        <h2>Galleta Oreo</h2>
                        <p className="menu-item-description">
                            Helado de vainilla con trozos de galleta Oreo.
                        </p>
                    </article>
                </main>

                <footer>
                    <p>La Heladería — Ambato</p>
                </footer>
            </>
        );

        const container = document.getElementById("root");
        createRoot(container).render(menu);
    </script>
</body>
</html>
